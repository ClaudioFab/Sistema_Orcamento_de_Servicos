<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix</title>
    <!-- Conecção com style css -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- Body inteiro -->

<body>
    <!-- Cabeçalho todo -->
    <header>
        <!-- Header titulo e subtitulo -->
        <h1 class="titulo">TechFix Informática</h1>
        <h2 class="subtitulo">Manutenção e suporte para seu computador.</h2>
    </header>

    <!-- Conteúdo principal da página-->
    <main>
        <!-- Section inteira -->
        <!-- Primeira sessão -->
        <section id="inicio">
            <h2 class="secao1">Orçamento de serviços</h2>

            <!-- Questão nome -->
            <label class="clienteNome">Nome do cliente:</label>

            <!-- Entrada de nome -->
            <input id="nome" placeholder="Digite seu nome"><br><br><br>

            <!-- Questão serviço -->
            <label class="servicoNome">Escolha o serviço:</label>

            <!-- Entrada de Select escolher opções -->
            <select id="servico">
                <!-- disabled selected funciona como um placeholder -->
                <option value="" disabled selected>Selecione um serviço</option>

                <option value="formatacao">Formatação de computador</option>
                <option value="limpeza">Limpeza e manutenção</option>
                <option value="programas">Instalação de programas</option>
                <option value="backup">Backup de arquivos</option>
            </select><br><br>

            <!-- div com botões juntos -->
            <div class="botoes">
                <!-- Botão input de confirmação -->
                <button onclick="entradaBotao()" class="botao" href="#servicos">Calcular Orçamento</button>

                <!-- Botão limpar -->
                <button onclick="limparBotao()" class="botao">Limpar</button><br>
            </div>


            <!-- Resultado final -->
            <p id="resultado" class="resultados"></p>
        </section>

    </main>
    <!-- Nome empresa, direitos autorais, ano, contratos, links, informações institucionais -->
    <footer>
        <!-- Footer -->
        <p>TechFix Informática - 2026</p>
    </footer>

    <!-- Conexão JavaScript -->
    <script src="script.js"></script>
</body>

</html>
